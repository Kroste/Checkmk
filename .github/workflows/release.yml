name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # Windows: self-contained Single-File-EXE -> ZIP
  # ---------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish (win-x64)
        run: >
          dotnet publish Checkmk.App/Checkmk.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win

      - name: Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path publish/win/* -DestinationPath "Checkmk-$ver-win-x64.zip"

      # Signiertes Manifest. Ohne das Secret wird nichts signiert und der Schritt
      # laeuft still durch — solange in UpdateSignature.PublicKeyBase64 kein
      # Schluessel steht, prueft das Cockpit ohnehin nicht. Steht dort einer, ist
      # ein fehlendes update.json ein abgelehntes Update, kein stiller Durchlauf.
      # Die Pruefung steht im Skript und nicht in einer `if`-Bedingung: Der
      # `secrets`-Kontext ist in Step-Bedingungen nicht verfuegbar, und der
      # Umweg ueber eine Job-Variable ist eine Falle mehr als er wert ist.
      - name: Sign update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) {
            Write-Host "Kein UPDATE_SIGNING_KEY hinterlegt - update.json wird nicht erzeugt."
            exit 0
          }
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $zip = "Checkmk-$ver-win-x64.zip"
          & publish/win/Checkmk.App.exe --sign-update $zip $ver $env:UPDATE_SIGNING_KEY update.json
          if (-not (Test-Path update.json)) { throw "update.json wurde nicht erzeugt." }
          Get-Content update.json

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            Checkmk-*-win-x64.zip
            update.json

  # ---------------------------------------------------------------
  # Release anlegen und Windows-ZIP anhaengen
  # ---------------------------------------------------------------
  release:
    needs: [ windows ]
    runs-on: ubuntu-latest
    steps:
      # Volle Historie fuer die Tag-Message-Extraktion (annotated tag body).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Release-Body:
      #  1. RELEASE_NOTES/<tag>.md im Repo (bevorzugt, ausfuehrliche Notes)
      #  2. sonst: Message des annotated Git-Tags
      #  3. sonst: leerer Body (softprops setzt dann nur den Tag-Namen)
      - name: Prepare release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="RELEASE_NOTES/${tag}.md"
          if [ -f "$notes_file" ]; then
            echo "Using $notes_file"
            cp "$notes_file" release-body.md
          else
            echo "Falling back to annotated tag message of $tag"
            git tag -l --format='%(contents)' "$tag" > release-body.md
          fi
          echo "--- Release-Body ---"
          cat release-body.md

      # Debug-Hilfe fuer den naechsten Release-Bug: was liegt wirklich in artifacts/?
      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          # Rekursiver Glob — actions/download-artifact hat zwischen Major-Versionen
          # schon mal die Verzeichnisstruktur geaendert (mit/ohne <name>-Unterordner).
          # `artifacts/**/*.zip` faengt beide Faelle.
          files: |
            artifacts/**/*.zip
            artifacts/**/update.json
